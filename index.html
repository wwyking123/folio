<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Folio</title>
    <style>
      :root {
        --chrome-bg: #ffffff;
        --status-bg: #f3f4f6;
        --chrome-border: #e1e3e8;
        --canvas-bg: #eceef2;
        --text: #1f2328;
        --text-muted: #676e7a;
        --control-hover: rgba(15,23,42,.07);
        --control-active: rgba(15,23,42,.12);
        --accent: #185abd;
        --accent-soft: rgba(24,90,189,.13);
        --chrome-shadow: 0 1px 2px rgba(15,23,42,.06), 0 2px 8px rgba(15,23,42,.05);
        --field-bg: #ffffff;
        --error-bg: #fde8e8;
        --error-text: #6b1d1d;
        --page-shadow: 0 1px 3px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.08);
        --find-match: rgba(255, 213, 0, .35);
        --find-current: rgba(255, 150, 0, .55);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --chrome-bg: #2b2c30;
          --status-bg: #232427;
          --chrome-border: #3d3e44;
          --canvas-bg: #1a1b1e;
          --text: #e6e7ea;
          --text-muted: #9aa0aa;
          --control-hover: rgba(255,255,255,.09);
          --control-active: rgba(255,255,255,.15);
          --accent: #7aa7ff;
          --accent-soft: rgba(122,167,255,.24);
          --chrome-shadow: 0 1px 2px rgba(0,0,0,.4);
          --field-bg: #1f2023;
          --error-bg: #3a2224;
          --error-text: #ffb4b4;
          /* The page stays white in both themes, so the tints do not change. */
          --find-match: rgba(255, 213, 0, .35);
          --find-current: rgba(255, 150, 0, .55);
        }
      }
      html, body { height: 100%; margin: 0 }
      #pages { height: 100% }
      body.shell {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        color: var(--text);
        background: var(--canvas-bg);
      }
      body.shell #pages {
        flex: 1 1 auto;
        min-height: 0;
        height: auto;
      }
      /* #pages holds one host per open document, stacked. Only the active tab's host is visible. A background host
         stays laid out (visibility, not display) so a pagination still running there keeps measuring real heights. */
      body.shell #pages { position: relative }
      #pages > .doc-host {
        position: absolute;
        inset: 0;
        height: auto;
      }
      #pages > .doc-host.background {
        visibility: hidden;
        pointer-events: none;
        z-index: 0;
      }
      #pages > .doc-host.active { z-index: 1 }
      .tabs {
        flex: none;
        display: flex;
        align-items: flex-end;
        gap: 2px;
        min-height: 34px;
        padding: 6px 8px 0;
        box-sizing: border-box;
        font: 13px/1.4 system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
        color: var(--text-muted);
        background: var(--status-bg);
        border-bottom: 1px solid var(--chrome-border);
        user-select: none;
        -webkit-user-select: none;
      }
      .tabs.covered { pointer-events: none; opacity: .6 }
      .tabs-list {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        min-width: 0;
        overflow: hidden;
      }
      .tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        box-sizing: border-box;
        width: 200px;
        min-width: 90px;
        flex: 0 1 200px;
        height: 28px;
        margin-bottom: -1px;
        padding: 0 4px 0 10px;
        border: 1px solid transparent;
        border-bottom: 0;
        border-radius: 7px 7px 0 0;
        cursor: default;
      }
      .tab:hover { background: var(--control-hover) }
      .tab.active {
        color: var(--text);
        background: var(--chrome-bg);
        border-color: var(--chrome-border);
        height: 29px;
      }
      .tab-dirty {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0;
      }
      .tab.dirty .tab-dirty { opacity: .85 }
      .tab-label {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .tab-close, .tab-new {
        flex: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        color: inherit;
        background: transparent;
        border: 0;
        border-radius: 5px;
        cursor: default;
      }
      .tab-close { width: 20px; height: 20px }
      .tab-close svg { width: 14px; height: 14px }
      .tab-close:hover, .tab-new:hover { background: var(--control-active) }
      .tab-new {
        width: 26px;
        height: 26px;
        margin: 0 0 2px 2px;
      }
      .tab-new svg { width: 16px; height: 16px }
      .tab-close:focus { outline: none }
      .tab-new:focus-visible, .tab-close:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .toolbar, .tablebar, .status, .open-error {
        flex: none;
        font: 13px/1.4 system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
      }
      .toolbar {
        /* acdert hit testing ignores the scroller clip, so content scrolled above the box covers this bar. */
        position: relative;
        z-index: 2;
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        min-height: 42px;
        padding: 0 10px;
        row-gap: 4px;
        color: var(--text);
        background: var(--chrome-bg);
        border-bottom: 1px solid var(--chrome-border);
        box-shadow: var(--chrome-shadow);
      }
      .toolbar.with-table {
        border-bottom: 0;
        box-shadow: none;
      }
      .toolbar .group {
        display: flex;
        flex: none;
        align-items: center;
        height: 28px;
      }
      .toolbar .group.end { margin-left: auto }
      .toolbar .group > :not(.divider) + :not(.divider) { margin-left: 2px }
      .toolbar .divider,
      .tablebar .divider {
        flex: none;
        width: 1px;
        height: 18px;
        margin: 0 6px;
        background: var(--chrome-border);
      }
      .toolbar button {
        box-sizing: border-box;
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 5px;
        appearance: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        line-height: 1;
        white-space: nowrap;
        user-select: none;
      }
      .toolbar button.file {
        width: auto;
        padding: 0 8px;
        gap: 2px;
        font-weight: 600;
      }
      .toolbar button.file[aria-expanded="true"] {
        background: var(--control-active);
      }
      .toolbar button svg,
      .toolbar button .glyph,
      .tablebar button svg,
      .file-menu button svg {
        display: block;
        width: 18px;
        height: 18px;
        flex: none;
      }
      .toolbar button svg,
      .tablebar button svg,
      .file-menu button svg { overflow: visible }
      .toolbar button .glyph {
        position: relative;
        font-family: system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
        font-size: 14px;
        font-weight: 700;
        line-height: 18px;
        text-align: center;
      }
      .toolbar button .glyph.italic { font-style: italic }
      .toolbar button .glyph.underline::after,
      .toolbar button .glyph.strike::after {
        content: "";
        position: absolute;
        height: 1.5px;
        border-radius: 1px;
        background: currentColor;
      }
      .toolbar button .glyph.underline::after { left: 3px; right: 3px; bottom: 1px }
      .toolbar button .glyph.strike::after { left: 2px; right: 2px; top: 8px }
      .toolbar button:hover,
      .tablebar button:hover {
        background: var(--control-hover);
      }
      .toolbar button[aria-pressed="mixed"] {
        background: var(--control-hover);
      }
      .toolbar button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
      }
      .toolbar button:active,
      .tablebar button:active {
        background: var(--control-active);
      }
      .toolbar button:disabled,
      .tablebar button:disabled {
        opacity: 0.38;
      }
      .toolbar button:disabled:hover,
      .toolbar button:disabled:active,
      .tablebar button:disabled:hover,
      .tablebar button:disabled:active {
        background: transparent;
        box-shadow: none;
      }
      .toolbar button:focus,
      .toolbar select:focus,
      .tablebar button:focus,
      .status button:focus,
      .status select:focus,
      .file-menu button:focus {
        outline: none;
      }
      .toolbar button:focus-visible,
      .toolbar select:focus-visible,
      .tablebar button:focus-visible,
      .status button:focus-visible,
      .status select:focus-visible,
      .file-menu button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .toolbar select {
        box-sizing: border-box;
        flex: none;
        height: 26px;
        margin: 0;
        /* acdert draws its own chevron inside the content box even with appearance: none, so the page adds none. */
        padding: 0 4px 0 8px;
        border: 1px solid var(--chrome-border);
        border-radius: 5px;
        appearance: none;
        background-color: var(--field-bg);
        color: var(--text);
        font: inherit;
        line-height: 24px;
      }
      .toolbar select:hover {
        border-color: var(--text-muted);
      }
      /* 10em and 8em leave the format controls on one row at 1180px. 11em and 8.5em wrap. */
      .toolbar select.font { width: 10em }
      .toolbar select.size { width: 4.5em }
      .toolbar select.style { width: 8em }
      .findbar {
        position: absolute;
        right: 12px;
        z-index: 3;
        box-sizing: border-box;
        display: grid;
        grid-template-columns: 28px 240px auto;
        column-gap: 6px;
        row-gap: 4px;
        align-items: center;
        max-width: calc(100% - 24px);
        padding: 8px;
        color: var(--text);
        background: var(--chrome-bg);
        border: 1px solid var(--chrome-border);
        border-radius: 8px;
        box-shadow: var(--chrome-shadow);
        font: 13px/1.4 system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
        user-select: none;
      }
      .findbar .find-query { grid-column: 2; grid-row: 1 }
      .findbar .find-replace-text { grid-column: 2; grid-row: 2 }
      .findbar .find-toggle { grid-column: 1; grid-row: 1 }
      .findbar .find-tools { grid-column: 3; grid-row: 1 }
      .findbar .find-actions { grid-column: 3; grid-row: 2 }
      .findbar .find-tools,
      .findbar .find-actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .findbar input {
        box-sizing: border-box;
        width: 240px;
        height: 26px;
        margin: 0;
        padding: 0 8px;
        border: 1px solid var(--chrome-border);
        border-radius: 5px;
        background: var(--field-bg);
        color: var(--text);
        font: inherit;
        user-select: text;
      }
      .findbar input[aria-invalid="true"] { border-color: var(--error-text) }
      .findbar input::placeholder { color: var(--text-muted); opacity: 0.8 }
      .findbar button {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 5px;
        appearance: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        line-height: 1;
        white-space: nowrap;
      }
      .findbar button.icon { width: 28px; height: 28px }
      .findbar button.text {
        height: 26px;
        padding: 0 8px;
        border: 1px solid var(--chrome-border);
        background: transparent;
      }
      .findbar button.icon svg { display: block; width: 18px; height: 18px }
      .findbar .find-toggle svg { transform: rotate(-90deg) }
      .findbar .find-toggle[aria-expanded="true"] svg { transform: none }
      .findbar .prev svg { transform: rotate(180deg) }
      .findbar button .glyph {
        position: relative;
        font-family: system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
        font-size: 14px;
        font-weight: 700;
        line-height: 18px;
      }
      .findbar button .glyph.word::after {
        content: "";
        position: absolute;
        left: 1px;
        right: 1px;
        bottom: 0;
        height: 1.5px;
        border-radius: 1px;
        background: currentColor;
      }
      .findbar .count {
        margin-right: 4px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .findbar .count.muted { color: var(--text-muted) }
      .findbar button:hover { background: var(--control-hover) }
      .findbar button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
      }
      .findbar button:active { background: var(--control-active) }
      .findbar button:disabled { opacity: 0.38 }
      .findbar button:disabled:hover { background: transparent; box-shadow: none }
      .findbar button:focus,
      .findbar input:focus { outline: none }
      .findbar button:focus-visible,
      .findbar input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .toolbar .split {
        display: flex;
        flex: none;
        align-items: stretch;
        height: 28px;
        border-radius: 5px;
      }
      .toolbar .split:hover { background: var(--control-hover) }
      .toolbar .split:has(button[aria-expanded="true"]),
      .toolbar .split:has(button[aria-expanded="true"]):hover { background: var(--control-active) }
      .toolbar .split button { background: transparent }
      .toolbar .split button.chevron { width: 14px }
      .toolbar .split button.chevron svg { width: 14px; height: 14px }
      .toolbar .split button:hover,
      .toolbar .split button:active,
      .toolbar .split button[aria-expanded="true"] { background: transparent }
      .toolbar button .glyph.color {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        font-size: 13px;
        line-height: 13px;
      }
      .toolbar button .glyph.color .bar {
        display: block;
        width: 14px;
        height: 3px;
        margin-top: 1px;
        border-radius: 1px;
      }
      .toolbar button .glyph.color svg {
        width: 18px;
        height: 14px;
      }
      .file-menu {
        /* Its own stacking position, above #pages. The bar's overflow would lose the hit to the scroller. */
        position: fixed;
        z-index: 2;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        min-width: 220px;
        margin: 0;
        padding: 4px;
        color: var(--text);
        background: var(--chrome-bg);
        border: 1px solid var(--chrome-border);
        border-radius: 8px;
        box-shadow: var(--chrome-shadow);
        font: 13px/1.4 system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
      }
      .file-menu button {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        width: 100%;
        height: 28px;
        margin: 0;
        padding: 0 8px;
        gap: 8px;
        border: 0;
        border-radius: 5px;
        appearance: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-weight: 400;
        line-height: 1;
        text-align: left;
        white-space: nowrap;
        user-select: none;
      }
      .file-menu button:hover { background: var(--control-hover) }
      .file-menu button:active { background: var(--control-active) }
      .file-menu button:disabled { opacity: 0.38 }
      .file-menu button:disabled:hover,
      .file-menu button:disabled:active { background: transparent }
      .file-menu.narrow { min-width: 168px }
      .file-menu .mark {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
      }
      .file-menu .name { min-width: 0 }
      .file-menu .chord {
        margin-left: auto;
        padding-left: 16px;
        color: var(--text-muted);
        font-size: 12px;
      }
      .file-menu .sep {
        height: 1px;
        margin: 4px 8px;
        background: var(--chrome-border);
      }
      .file-menu button[aria-checked="true"]:not(.swatch) {
        background: var(--accent-soft);
        color: var(--accent);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);
      }
      .file-menu.palette {
        display: grid;
        grid-template-columns: repeat(var(--cols, 10), 18px);
        gap: 2px;
        width: max-content;
        min-width: 0;
      }
      .file-menu.palette button.item {
        width: auto;
        height: 28px;
      }
      .file-menu button.swatch {
        width: 18px;
        height: 18px;
        min-width: 18px;
        padding: 0;
        gap: 0;
        border: 1px solid var(--chrome-border);
        border-radius: 2px;
      }
      .file-menu button.swatch[aria-checked="true"] {
        box-shadow: 0 0 0 1px var(--chrome-bg), 0 0 0 3px var(--accent);
      }
      .tablebar {
        position: relative;
        z-index: 2;
        box-sizing: border-box;
        display: flex;
        flex: none;
        align-items: center;
        height: 34px;
        padding: 0 10px;
        color: var(--text);
        background: var(--chrome-bg);
        border-top: 1px solid var(--chrome-border);
        box-shadow: var(--chrome-shadow);
        white-space: nowrap;
      }
      .tablebar .caption {
        flex: none;
        margin-right: 8px;
        color: var(--text-muted);
      }
      .tablebar .group {
        display: flex;
        flex: none;
        align-items: center;
      }
      .tablebar .group > :not(.divider) + :not(.divider) { margin-left: 2px }
      .tablebar button {
        box-sizing: border-box;
        display: inline-flex;
        flex: none;
        align-items: center;
        height: 26px;
        margin: 0;
        padding: 0 8px;
        gap: 6px;
        border: 0;
        border-radius: 5px;
        appearance: none;
        background: transparent;
        color: var(--text);
        font: inherit;
        line-height: 1;
        white-space: nowrap;
        user-select: none;
      }
      .status {
        /* The zoom controls take clicks, and acdert hit testing ignores the scroller clip, as for the toolbar. */
        position: relative;
        z-index: 1;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: 28px;
        padding: 0 10px;
        font-size: 12px;
        line-height: 22px;
        color: var(--text-muted);
        background: var(--status-bg);
        border-top: 1px solid var(--chrome-border);
      }
      .status-text {
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .status-zoom {
        display: flex;
        flex: none;
        align-items: center;
        gap: 2px;
      }
      .status button {
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 5px;
        appearance: none;
        background: transparent;
        color: var(--text-muted);
        font: inherit;
      }
      .status button svg {
        display: block;
        width: 18px;
        height: 18px;
      }
      .status button:hover { background: var(--control-hover) }
      .status button:active { background: var(--control-active) }
      .status button:disabled { opacity: 0.38 }
      .status button:disabled:hover,
      .status button:disabled:active { background: transparent }
      .status select.zoom {
        box-sizing: border-box;
        height: 22px;
        width: 5em;
        margin: 0;
        /* acdert draws its own chevron inside the content box even with appearance: none, so the page adds none. */
        padding: 0 2px 0 6px;
        border: 1px solid transparent;
        border-radius: 5px;
        appearance: none;
        background-color: transparent;
        color: var(--text-muted);
        font: inherit;
        line-height: 20px;
      }
      .status select.zoom:hover {
        border-color: var(--chrome-border);
        background-color: var(--field-bg);
      }
      .open-error {
        /* This band sits above the scroller, so the same clip-blind hit testing would cover it. */
        position: relative;
        z-index: 1;
        margin: 0;
        padding: 6px 10px;
        background: var(--error-bg);
        color: var(--error-text);
      }
      .open-error button {
        margin-left: 8px;
        padding: 0 8px;
        border: 1px solid var(--error-text);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        line-height: 1.6;
        vertical-align: middle;
        cursor: pointer;
      }
      .open-error button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .open-error button:focus { outline: none }
      .open-error button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      /* Author `display` beats the user-agent `[hidden]` rule, so a hidden bar would stay on screen and in inspect. */
      .toolbar[hidden],
      .tablebar[hidden],
      #pages[hidden],
      .preview[hidden],
      .preview-bar button[hidden],
      .findbar[hidden],
      .findbar [hidden] {
        display: none !important;
      }
      .preview {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--canvas-bg);
        font: 13px/1.4 system-ui, "PingFang SC", "Noto Sans SC", sans-serif;
        color: var(--text);
      }
      .preview-bar {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        box-sizing: border-box;
        min-height: 44px;
        padding: 0 8px;
        background: var(--chrome-bg);
        border-bottom: 1px solid var(--chrome-border);
      }
      .preview-count {
        margin-right: auto;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .preview-bar button {
        height: 28px;
        padding: 0 12px;
        color: var(--text);
        background: var(--field-bg);
        border: 1px solid var(--chrome-border);
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      .preview-bar button.primary {
        background: var(--accent-soft);
